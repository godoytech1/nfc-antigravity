name: Supabase keep-alive

# El plan Free de Supabase pausa el proyecto tras ~7 días sin actividad, y con
# el proyecto pausado la app muestra "sin conexión a internet". Este job hace
# una consulta real a la base una vez al día para que cuente como actividad.
#
# Si Supabase igual está pausado (o caído), el job falla y GitHub avisa por mail.

on:
  schedule:
    - cron: '17 12 * * *' # todos los días 12:17 UTC (08:17 en Paraguay)
  workflow_dispatch: {} # también se puede lanzar a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de Supabase
        env:
          SUPABASE_URL: https://scejwfjmbeerwymwufwe.supabase.co
          # anon key: pública por diseño (protegida por RLS), igual que en la app y el panel
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjZWp3ZmptYmVlcnd5bXd1ZndlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NjM1NTIsImV4cCI6MjEwMzQzOTU1Mn0.yAO7VW4ykJ7kfkjiQPdM8F65rdLuTvyZ4MvCu9CS6XM
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/configuracion?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondió HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase no respondió 200. ¿Proyecto pausado? Restaurarlo desde el dashboard."
            exit 1
          fi
